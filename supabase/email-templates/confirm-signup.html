<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to WeekFlow - Confirm your account</title>
  </head>
  <body style="margin:0;background:#f4f7fb;color:#172334;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dbe3ee;border-radius:8px;">
          <tr><td style="padding:32px 32px 20px;border-bottom:1px solid #e8edf4;">
            <div style="font-size:24px;font-weight:700;letter-spacing:.2px;color:#172334;">WeekFlow</div>
          </td></tr>
          <tr><td style="padding:32px;">
            <h1 style="margin:0 0 18px;font-size:28px;line-height:1.2;color:#172334;">Welcome to WeekFlow</h1>
            <p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#4b5b70;">Thanks for creating your WeekFlow account.</p>
            <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#4b5b70;">Confirm your email address to activate your account and start organizing your week with WeekFlow.</p>
            <table role="presentation" cellspacing="0" cellpadding="0"><tr><td style="border-radius:6px;background:#69a9ff;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;border:1px solid #69a9ff;border-radius:6px;color:#071018;font-size:15px;font-weight:700;text-decoration:none;">Activate my WeekFlow account</a>
            </td></tr></table>
            <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#718096;">If you didn&apos;t create a WeekFlow account, you can safely ignore this email.</p>
          </td></tr>
          <tr><td style="padding:18px 32px;border-top:1px solid #e8edf4;font-size:12px;line-height:1.5;color:#8794a6;">WeekFlow</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
